[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Test-only: the vendored Textile/UniswapX reactor (test/vendor) imports OpenZeppelin by package path.
remappings = ["@openzeppelin/contracts/=test/vendor/openzeppelin/contracts/", "forge-std/=lib/forge-std/src/"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = false
fs_permissions = [{ access = "read", path = "./test/vectors" }, { access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
celo = "${CELO_RPC_URL}"

[fmt]
line_length = 120
