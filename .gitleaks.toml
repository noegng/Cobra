# Gitleaks config (read automatically by gitleaks-action at the repo root).
# Keep every default rule; only allow values that are exactly a public EVM address (0x + 40 hex), which the
# generic-api-key rule flags in research/data files ("token0": "0x…"). Private keys (0x + 64 hex) stay detected.
# Also allow a "secret" that is only a reference to an environment variable (`const key = env.X402_API_KEY;`):
# it names where the secret lives and holds no value.
# And anvil's three public default test keys (accounts #0 0xf39F…, #1 0x7099…, #2 0x3C44…), used only by tests.
# Any other 64-hex value is still reported.
title = "cobra gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Public EVM addresses and env-variable references are not secrets"
regexTarget = "secret"
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
  '''^(process\.)?env\.[A-Z][A-Z0-9_]*;?$''',
  '''^(0x)?59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d$''',
  '''^(0x)?5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a$''',
  '''^(0x)?ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''',
]
